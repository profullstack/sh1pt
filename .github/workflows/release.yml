name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The cli depends on the six packages below it, and pnpm rewrites
      # `workspace:` to a real range on publish — so every one of them has to
      # reach the registry or `npm i @profullstack/sh1pt` 404s on a dep.
      # Keep this list in step with PACKAGES in scripts/version.mjs.
      - run: >
          pnpm
          --filter @profullstack/sh1pt-core
          --filter @profullstack/sh1pt-openapi
          --filter @profullstack/sh1pt-actions-fleet-core
          --filter @profullstack/sh1pt-action-packs
          --filter @profullstack/sh1pt-secrets-env-updater
          --filter @profullstack/sh1pt-policy
          --filter @profullstack/sh1pt
          build

      - name: Publish @profullstack/sh1pt-core
        run: pnpm --filter @profullstack/sh1pt-core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @profullstack/sh1pt-openapi
        run: pnpm --filter @profullstack/sh1pt-openapi publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @profullstack/sh1pt-actions-fleet-core
        run: pnpm --filter @profullstack/sh1pt-actions-fleet-core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @profullstack/sh1pt-action-packs
        run: pnpm --filter @profullstack/sh1pt-action-packs publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @profullstack/sh1pt-secrets-env-updater
        run: pnpm --filter @profullstack/sh1pt-secrets-env-updater publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @profullstack/sh1pt-policy
        run: pnpm --filter @profullstack/sh1pt-policy publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @profullstack/sh1pt
        run: pnpm --filter @profullstack/sh1pt publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
