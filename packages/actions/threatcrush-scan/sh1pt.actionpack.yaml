schemaVersion: 1
id: threatcrush-scan
name: ThreatCrush Security Scan
description: >-
  Scans pull requests for hardcoded credentials, injection, SSRF, unsafe
  deserialisation and dependency tampering, and uploads SARIF to the Security
  tab.
version: 2.0.0
publisher: profullstack
visibility: public
license: MIT
categories:
  - security
  - ci
compatibility:
  providers:
    - github
pricing:
  type: free
inputs:
  scanPath:
    type: string
    default: '.'
    description: Path to scan, relative to the repository root.
  nodeVersion:
    type: string
    default: '20'
    description: >-
      Node version used to install the CLI. 20 deliberately — the CLI depends
      on better-sqlite3, and 20 is the newest runtime with reliable prebuilt
      binaries for it. Newer runtimes fall through to a node-gyp source build
      that fails without a full toolchain.
  threatcrushPackageSpec:
    type: string
    default: '@profullstack/threatcrush@0.11.2'
    description: >-
      npm spec used to install the CLI. Pinned, not `@latest`: a scanner that
      runs on every pull request is a dependency, and `@latest` means one bad
      publish breaks CI in every repo that installed this pack at once — which
      is exactly what a `workspace:` protocol slip in 0.7.0/0.7.1 did. Bump this
      deliberately, in a pack release, so the fleet re-syncs consumers to a
      version that was checked first.
  threatcrushIntegrity:
    type: string
    default: 'sha512-8N3jqCQixK0Onc+/bvuJaNCSvGZlJYZcSAGsd1nEfRZ4kOu1Ifom7Bd1t2muYJAmAxBTPmz1iseWSay/0gg3Gw=='
    description: >-
      Subresource-integrity hash of the tarball named by threatcrushPackageSpec,
      in npm's own `sha512-<base64>` form. The workflow downloads, hashes and
      compares before installing, and refuses to install on a mismatch.

      A version pin says which release to fetch. It does not say the bytes are
      the ones that release was published with, and the party answering the
      first question is the party serving the bytes. This is the other half,
      and it is what Haven's maintainer asked for when they declined on
      "exact version + integrity hash".

      Must be bumped together with threatcrushPackageSpec — a hash from a
      different version fails closed, which is the correct direction to fail
      but a confusing one to debug. Read it from
      `npm view <spec> dist.integrity`. Empty skips verification, for a
      consumer pointing the spec at something they build themselves.
  commentOnPr:
    type: string
    default: 'true'
    enum:
      - 'true'
      - 'false'
    description: >-
      Post the report as a pull request comment. Requires
      `pull-requests: write`.

      Set this and uploadSarif both to 'false' and the workflow requests
      `contents: read` and nothing else — findings arrive in the job summary
      and the SARIF artifact instead. That is the configuration for a
      repository that wants the scan without granting a third-party CLI any
      write scope, which is a substantial part of what reviewers decline on.
  # No input controls the `permissions:` block. Each write scope is emitted by
  # the output that needs it — `pull-requests: write` from commentOnPr,
  # `security-events: write` from uploadSarif — so the block cannot drift out of
  # step with what the workflow actually does. It used to be an `extraPermissions`
  # string the caller assembled by hand, which made "least privilege" a thing a
  # caller had to remember rather than a property of the template.
  #
  # Omitted, not disabled: with both outputs off the rendered file has no write
  # scope and no step that would use one.
  failOn:
    type: string
    default: ''
    description: >-
      Comma-separated severities that fail the job (e.g. "critical,high").
      Empty means report-only, which is the right default for a first install:
      a repository with pre-existing findings should get a report, not a
      blocked pull request. Tighten it once the backlog is triaged.
  uploadSarif:
    type: string
    default: 'true'
    enum:
      - 'true'
      - 'false'
    description: >-
      Upload results to the GitHub Security tab. Requires code scanning, which
      is free on public repositories and needs Advanced Security on private
      ones. The workflow skips the upload gracefully when it is unavailable.
secrets: []
repoVariables: []
files:
  - source: workflow.yml
    destination: .github/workflows/threatcrush-scan.yml
    mergeStrategy: replace-managed
policies:
  installMode: pull-request
  managedComment: true
  requiresReview: true
security:
  leastPrivilegePermissions: true
  # Required, not optional. Asking a repository to trust a pinned npm package
  # while the workflow around it floats on mutable tags is an argument that
  # does not survive being read, and the SAG maintainers read it: the job holds
  # pull-requests: write and security-events: write, so every action in it is
  # the same class of grant the npm pin exists to close.
  pinThirdPartyActions: required
  allowPullRequestTarget: false
  defaultTimeoutMinutes: 15
